kind = "web"
previewPath = "/"
title = "MilesWeb Clone"
version = "1.0.0"
id = "artifacts/milesweb-clone"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18257

[services.development]
run = "pnpm --filter @workspace/milesweb-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/milesweb-clone", "run", "build" ]
publicDir = "artifacts/milesweb-clone/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18257"
BASE_PATH = "/"
